[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvis-cdr-reconstruction"
version = "0.2.0"
description = "Independently reconstructed research pipeline for CVIS radar CDR reproducibility"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "pandas>=2", "h5py>=3.9", "Pillow>=9", "matplotlib>=3.7", "scikit-learn>=1.2", "torch>=2.1", "torchvision>=0.16", "tqdm>=4.66"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
